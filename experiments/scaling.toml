# this file describes the parameter to test for one experiment. The executions are a result of the cartesian product of all these options

[pbs.product] #the pbs lines that we want to test with multiple options 
select    = [1, 2, 4, 8]  # PBS chunks
mpiprocs      = [16] 
ompthreads = [1] # TODO for hybrid runs: determine this with scalability analysis on one node only, then fix it for rest of runs.
place = ["scatter" , "pack"] #, "pack:excl", "scatter:excl"

[pbs.derive]
ncpus = "mpiprocs * ompthreads"
np    = "select * mpiprocs"          # total MPI ranks, used in mpirun -np
cores = "select * ncpus"

[cases.product] # expanded inside each job
algo            = ["parallel"]
lg_n_items      = [10, 11]
lg_unique_items = [9]                # TODO: could be a fraction of n_items
lg_k            = [10, 12]
warmup_reps     = [2]
reps            = [10]

[cases.derive]
n_items      = "2 ** lg_n_items"     # assumption: lg_* means log2; adjust if not
unique_items = "2 ** lg_unique_items"
